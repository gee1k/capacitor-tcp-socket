name: Verify plugin and example
on: [push, pull_request, workflow_dispatch]

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm test && npm run eslint
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm run test:browser
        working-directory: example

  android-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npm run build
      - run: npm ci && npm run build && npx cap sync android
        working-directory: example
      - run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2
        working-directory: example/android
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          working-directory: example/android
          script: |
            adb shell cmd package path android
            bash ./gradlew :app:connectedDebugAndroidTest --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            example/android/app/build/reports/androidTests/
            example/android/app/build/outputs/androidTest-results/

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: npm ci && npm run build && npx cap sync ios
        working-directory: example
      - name: Build the CocoaPods example
        run: xcodebuild -workspace example/ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build the SPM example
        run: npm run test:spm
        working-directory: example
      - name: Test the Swift package on an iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild -scheme CapacitorTcpSocket -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
